# Test the book's code, build the web book (executing the notebooks) and publish it on
# GitHub Pages. Pull requests are tested and built, but not published.
name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.13'
      - run: uv sync
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: uv sync

      # Wheel of the book's code, Pyodide and D3, published with the site (widgets/assets.py)
      - uses: actions/cache@v6
        with:
          path: _build/assets/pyodide
          key: pyodide-${{ hashFiles('widgets/assets.py') }}
      - run: uv run python widgets/assets.py

      # The site is served at https://<user>.github.io/<repository>/
      - name: Build the book
        run: PATH="$PWD/.venv/bin:$PATH" uv run jupyter-book build --html --execute
        env:
          BASE_URL: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
