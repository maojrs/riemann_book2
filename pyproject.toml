[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riemann-book"
version = "0.1.0"
description = "Code for the book 'Riemann Problems and Jupyter Solutions' (Ketcheson, LeVeque, del Razo)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "ipywidgets",
    "ipython",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter-book>=2",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["exact_solvers", "utils", "miniclaw", "widgets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
